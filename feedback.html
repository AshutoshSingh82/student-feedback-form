<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Form</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      padding: 30px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3498db;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .rating {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .rating label {
      font-weight: normal;
      cursor: pointer;
    }

    .rating input {
      width: auto;
      margin-right: 5px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2980b9;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: green;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Student Feedback Form</h1>
    <p class="subtitle">We value your feedback. Please share your experience.</p>

    <form id="feedbackForm">

      <div class="form-group">
        <label for="name">Student Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="roll">Roll Number</label>
        <input type="text" id="roll" name="roll"
               placeholder="Enter your roll number" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="course">Course / Subject</label>
        <select id="course" name="course" required>
          <option value="">-- Select Subject --</option>
          <option value="computer-science">Computer Science</option>
          <option value="mathematics">Mathematics</option>
          <option value="physics">Physics</option>
          <option value="chemistry">Chemistry</option>
          <option value="english">English</option>
        </select>
      </div>

      <div class="form-group">
        <label>How would you rate the course?</label>

        <div class="rating">
          <label>
            <input type="radio" name="rating" value="Excellent" required>
            Excellent
          </label>

          <label>
            <input type="radio" name="rating" value="Good">
            Good
          </label>

          <label>
            <input type="radio" name="rating" value="Average">
            Average
          </label>

          <label>
            <input type="radio" name="rating" value="Poor">
            Poor
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="teaching">How was the teaching?</label>

        <select id="teaching" name="teaching" required>
          <option value="">-- Select Rating --</option>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Average">Average</option>
          <option value="Poor">Poor</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comments">Your Feedback</label>

        <textarea id="comments" name="comments"
                  placeholder="Write your feedback here..."
                  required></textarea>
      </div>

      <div class="form-group">
        <label for="suggestions">Suggestions for Improvement</label>

        <textarea id="suggestions" name="suggestions"
                  placeholder="Enter your suggestions..."></textarea>
      </div>

      <button type="submit">Submit Feedback</button>

      <p id="message">Thank you! Your feedback has been submitted.</p>

    </form>
  </div>

  <script>
    document.getElementById("feedbackForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").style.display = "block";

      // Clear the form after submission
      this.reset();
    });
  </script>

</body>
</html>
